    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Animasi baru */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeInUp {
        animation: fadeInUp 0.4s ease-out forwards;
        opacity: 0; /* Mulai dari transparan */
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-2px); }
        75% { transform: translateX(2px); }
      }
      .animate-shake {
        animation: shake 0.3s ease-in-out forwards;
      }
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      /* Animasi pesan masuk (sekarang menggunakan fadeInUp) */
      .message-appear {
        animation: fadeInUp 0.4s ease-out forwards;
      }
      /* Gaya scrollbar kustom */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(107, 114, 128, 0.3); /* gray-500 */
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(107, 114, 128, 0.5); /* gray-500 */
      }
       /* Transisi Sidebar */
      .sidebar-transition {
        transition: transform 0.3s ease-in-out;
      }
    </style>
